[package]
name = "inklode-mcp"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Headless MCP server over stdio for one Inklode vault. No UI and no Tauri dependency."
authors = ["Alin Screciu"]
repository = "https://github.com/AlinScreciu/inklode"
keywords = ["markdown", "notes", "mcp", "local-first", "obsidian"]

[dependencies]
inklode-core = { path = "../core" }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
