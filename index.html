<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inklode</title>
    <script>
      // Before the first paint: light or dark, from the mode the last vault had (src/appearance.ts), else the system's.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("inklode.appearance");
        } catch (e) {}
        var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.appearance = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
