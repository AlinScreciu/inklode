name: Release

# A pushed tag v<version> builds, signs and notarizes that commit with scripts/release.sh and attaches the
# files to a DRAFT release. Installed apps see nothing until the draft is published by hand.
# docs/releasing.md, "From CI", lists the secrets.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon, as scripts/release.sh requires.
    runs-on: macos-latest
    timeout-minutes: 60
    # The secrets belong to this environment, so no other workflow can read them.
    environment: release
    env:
      KEYCHAIN: ${{ runner.temp }}/release.keychain-db
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is the version in the manifests
        run: |
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, tauri.conf.json has $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A keychain that exists for this run only: the Developer ID certificate with its key, and the
      # notarytool profile scripts/release.sh asks for.
      - name: Put the certificate and the notary profile in a keychain
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          # Without options: never locks by itself.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"

          base64 -d <<<"$CERTIFICATE_P12" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Lets codesign use the key without a prompt nobody could answer.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN" >/dev/null
          # codesign looks for identities in the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "the certificate is not a valid Developer ID Application identity" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

          xcrun notarytool store-credentials inklode-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"

      - name: Build, sign, notarize
        env:
          NOTARY_KEYCHAIN: ${{ env.KEYCHAIN }}
          # The key's content. The Tauri CLI reads it; nothing prints it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: scripts/release.sh

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are this version's section of the changelog.
          awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Inklode $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "release/$VERSION/Inklode-$VERSION-aarch64.dmg" \
            "release/$VERSION/Inklode.app.tar.gz" \
            "release/$VERSION/Inklode.app.tar.gz.sig" \
            "release/$VERSION/latest.json"

      - name: Delete the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
